<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Кабинет преподавателя</title>
<link rel="stylesheet" href="css/course.css">
</head>
<body>
<div id="boot">Загрузка…</div>
<div id="auth-screen" class="auth-wrap" hidden></div>

<div id="app" hidden>
  <div class="topbar"><div class="topbar-row">
    <div>
      <div class="k"><span data-course-title></span> · кабинет преподавателя</div>
      <div class="ctx" style="margin-top:.4em">
        <label>Группа <select id="ctx-group"></select></label>
        <label>Юнит <select id="ctx-unit"></select></label>
      </div>
    </div>
    <div class="ctx"><span id="me-email"></span><a class="btn small ghost" href="index.html">Вид студента</a><button class="btn small ghost" id="logout">Выйти</button></div>
  </div></div>
  <div class="tabs" id="tabs">
    <button data-tab="access">Доступ и проверка</button>
    <button data-tab="works">Работы студентов</button>
    <button data-tab="stats">Аналитика</button>
    <button data-tab="content">Контент и ключи</button>
    <button data-tab="groups">Группы и студенты</button>
  </div>
  <div class="wrap wide"><div id="view"></div></div>
</div>
<div id="denied" class="auth-wrap" hidden><div class="auth-card"><h1>Нет прав преподавателя</h1>
  <p>Этот аккаунт не отмечен как преподавательский. Роль назначается владельцем проекта в консоли Firebase (коллекция <code>teachers</code>).</p>
  <p><a href="index.html">Перейти к курсу</a> · <a href="#" id="logout2">Выйти</a></p></div></div>

<script type="module" src="js/teacher.js"></script>
</body></html>
